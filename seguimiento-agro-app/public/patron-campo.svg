<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Patrón de marca de agua: campesinos, cultivo (espiga), ganado y hojas,
    en tono azul institucional a baja opacidad, pensado para repetirse
    (background-repeat: repeat) y así verse consistente en cualquier ancho
    o alto de página, a diferencia de una foto única que solo se ve una vez.
    Ver CLAUDE.md antes de tocar este archivo.
  -->
  <defs>
    <g id="campesino">
      <ellipse cx="0" cy="-34" rx="11" ry="3.2" />
      <path d="M -5,-34 Q -5,-42 0,-43 Q 5,-42 5,-34 Z" />
      <circle cx="0" cy="-28" r="4.2" />
      <path d="M -8,-22 L 8,-22 L 11,4 L -11,4 Z" />
      <rect x="-6" y="4" width="4" height="12" rx="1.5" />
      <rect x="2" y="4" width="4" height="12" rx="1.5" />
      <line x1="9" y1="-16" x2="20" y2="-30" stroke-width="2.4" stroke-linecap="round" fill="none" />
      <rect x="16.5" y="-32.5" width="7" height="2.6" rx="1" transform="rotate(-32 20 -31.2)" />
    </g>
    <g id="vaca">
      <ellipse cx="0" cy="0" rx="14" ry="8" />
      <circle cx="-13" cy="-5" r="5" />
      <path d="M -17,-9 L -15,-13.5 L -12.5,-9.5 Z" />
      <rect x="-10" y="6" width="3" height="8" rx="1.2" />
      <rect x="-2" y="6" width="3" height="8" rx="1.2" />
      <rect x="6" y="6" width="3" height="8" rx="1.2" />
      <rect x="12" y="6" width="3" height="8" rx="1.2" />
      <path d="M13,-2 Q19,-2 18,5" stroke-width="1.8" fill="none" stroke-linecap="round" />
    </g>
    <g id="espiga">
      <line x1="0" y1="2" x2="0" y2="-30" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <ellipse cx="-4" cy="-26" rx="3" ry="1.6" transform="rotate(-30 -4 -26)" />
      <ellipse cx="4" cy="-23" rx="3" ry="1.6" transform="rotate(30 4 -23)" />
      <ellipse cx="-4" cy="-20" rx="3" ry="1.6" transform="rotate(-30 -4 -20)" />
      <ellipse cx="4" cy="-17" rx="3" ry="1.6" transform="rotate(30 4 -17)" />
      <ellipse cx="-3.5" cy="-14" rx="2.8" ry="1.5" transform="rotate(-30 -3.5 -14)" />
      <ellipse cx="3.5" cy="-11" rx="2.8" ry="1.5" transform="rotate(30 3.5 -11)" />
      <ellipse cx="0" cy="-31" rx="2.4" ry="1.4" />
    </g>
    <g id="hoja">
      <line x1="0" y1="10" x2="0" y2="-6" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M0,-6 C -8,-10 -10,-20 -2,-24 C 2,-16 4,-10 0,-6 Z" />
      <path d="M0,-2 C 8,-6 10,-14 3,-18 C -1,-11 -3,-5 0,-2 Z" />
    </g>
    <g id="sol">
      <circle cx="0" cy="0" r="5" />
      <g stroke-width="1.6" stroke-linecap="round">
        <line x1="0" y1="-9" x2="0" y2="-12" />
        <line x1="0" y1="9" x2="0" y2="12" />
        <line x1="-9" y1="0" x2="-12" y2="0" />
        <line x1="9" y1="0" x2="12" y2="0" />
        <line x1="-6.5" y1="-6.5" x2="-8.5" y2="-8.5" />
        <line x1="6.5" y1="6.5" x2="8.5" y2="8.5" />
        <line x1="-6.5" y1="6.5" x2="-8.5" y2="8.5" />
        <line x1="6.5" y1="-6.5" x2="8.5" y2="-8.5" />
      </g>
    </g>
  </defs>

  <g fill="#1c4a91" fill-opacity="0.16" stroke="#1c4a91" stroke-opacity="0.16">
    <use href="#campesino" transform="translate(40,70)" />
    <use href="#campesino" transform="translate(170,172) rotate(-8) scale(0.85)" />
    <use href="#vaca" transform="translate(188,55)" />
    <use href="#espiga" transform="translate(95,40) rotate(8)" />
    <use href="#espiga" transform="translate(30,192) rotate(-12) scale(0.9)" />
    <use href="#hoja" transform="translate(140,110) rotate(15)" />
    <use href="#hoja" transform="translate(212,132) rotate(-18) scale(0.85)" />
    <use href="#sol" transform="translate(62,150) scale(0.9)" />
  </g>
</svg>
