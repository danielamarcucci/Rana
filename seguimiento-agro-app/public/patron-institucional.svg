<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!--
    Marca de agua institucional: un emblema tipo sello/medallón oficial,
    a muy baja opacidad, repetido disperso en mosaico grande. No es el
    escudo oficial de Colombia ni del Ministerio (para no imitarlo de forma
    inexacta) — es un motivo propio de "sello agrario", en la tradición de
    los emblemas oficiales de reforma agraria/agricultura (campesino, sol,
    montañas, corona de espigas). Debe evocar el campo y el campesinado
    (pedido explícito del usuario) manteniéndose formal: trazo fino tipo
    grabado, monocromo, muy baja opacidad, sin colores vivos ni relleno
    plano — eso es lo que lo distingue de un ícono ilustrado "cartoon"
    (versión anterior, descartada por no verse institucional). Ver
    CLAUDE.md antes de tocar esto otra vez.
  -->
  <g transform="translate(240,240)" fill="none" stroke="#0f2547" stroke-opacity="0.15" stroke-width="1.4">
    <!-- escudo, doble contorno -->
    <path d="M -46,-56 Q -46,-74 0,-74 Q 46,-74 46,-56 L 46,-14 Q 46,42 0,72 Q -46,42 -46,-14 Z" />
    <path d="M -36,-48 Q -36,-62 0,-62 Q 36,-62 36,-48 L 36,-14 Q 36,30 0,58 Q -36,30 -36,-14 Z" />

    <!-- escena dentro del escudo: sol naciente sobre la cordillera -->
    <g stroke-opacity="0.19">
      <circle cx="0" cy="-38" r="8" />
      <g stroke-width="1.1">
        <line x1="0" y1="-51" x2="0" y2="-47" />
        <line x1="-13" y1="-38" x2="-17" y2="-38" />
        <line x1="13" y1="-38" x2="17" y2="-38" />
        <line x1="-9.2" y1="-47.2" x2="-11.8" y2="-49.8" />
        <line x1="9.2" y1="-47.2" x2="11.8" y2="-49.8" />
      </g>
      <path d="M -33,10 L -19,-6 L -9,4 L 3,-12 L 15,2 L 26,-8 L 33,0" />
    </g>

    <!-- campesino: sombrero, poncho y azadón, de pie sobre la cordillera -->
    <g transform="translate(-1,25) scale(0.6)" stroke-opacity="0.2" stroke-width="2">
      <ellipse cx="0" cy="-34" rx="11" ry="3.2" fill="#0f2547" fill-opacity="0.2" stroke="none" />
      <path d="M -5,-34 Q -5,-42 0,-43 Q 5,-42 5,-34 Z" fill="#0f2547" fill-opacity="0.2" stroke="none" />
      <circle cx="0" cy="-28" r="4.2" fill="#0f2547" fill-opacity="0.2" stroke="none" />
      <path d="M -8,-22 L 8,-22 L 11,4 L -11,4 Z" fill="#0f2547" fill-opacity="0.2" stroke="none" />
      <rect x="-6" y="4" width="4" height="12" rx="1.5" fill="#0f2547" fill-opacity="0.2" stroke="none" />
      <rect x="2" y="4" width="4" height="12" rx="1.5" fill="#0f2547" fill-opacity="0.2" stroke="none" />
      <line x1="9" y1="-16" x2="20" y2="-30" stroke-linecap="round" />
      <rect x="16.5" y="-32.5" width="7" height="2.6" rx="1" fill="#0f2547" fill-opacity="0.2" stroke="none" transform="rotate(-32 20 -31.2)" />
    </g>

    <!-- corona de espigas (en vez de laurel): motivo agrario clásico de
         sello oficial, enmarcando el escudo -->
    <g>
      <path d="M 48,18 Q 70,40 64,82 Q 61,114 42,136" />
      <g stroke-width="1.2">
        <path d="M 53,30 Q 58,28 61,32" /><path d="M 53,30 Q 58,32 59,37" />
        <path d="M 61,50 Q 67,49 70,53" /><path d="M 61,50 Q 66,53 66,59" />
        <path d="M 65,72 Q 71,72 73,77" /><path d="M 65,72 Q 70,75 69,81" />
        <path d="M 62,94 Q 68,95 69,101" /><path d="M 62,94 Q 67,97 65,103" />
        <path d="M 54,115 Q 60,117 60,123" /><path d="M 54,115 Q 58,119 55,124" />
      </g>
    </g>
    <!-- corona de espigas, lado izquierdo (espejo) -->
    <g transform="scale(-1,1)">
      <path d="M 48,18 Q 70,40 64,82 Q 61,114 42,136" />
      <g stroke-width="1.2">
        <path d="M 53,30 Q 58,28 61,32" /><path d="M 53,30 Q 58,32 59,37" />
        <path d="M 61,50 Q 67,49 70,53" /><path d="M 61,50 Q 66,53 66,59" />
        <path d="M 65,72 Q 71,72 73,77" /><path d="M 65,72 Q 70,75 69,81" />
        <path d="M 62,94 Q 68,95 69,101" /><path d="M 62,94 Q 67,97 65,103" />
        <path d="M 54,115 Q 60,117 60,123" /><path d="M 54,115 Q 58,119 55,124" />
      </g>
    </g>
  </g>
</svg>
