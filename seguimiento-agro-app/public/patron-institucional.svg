<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!--
    Marca de agua institucional: un emblema abstracto (escudo + estrella +
    laurel) a muy baja opacidad, repetido disperso en mosaico grande. No es
    el escudo oficial de Colombia ni del Ministerio (para no imitarlo de
    forma inexacta) — es un motivo genérico de "sello institucional",
    pensado para leerse formal/serio, no ilustrativo. Reemplaza un patrón
    anterior de íconos de campo (campesinos, ganado) que el usuario pidió
    quitar por no verse "institucional de élite". Ver CLAUDE.md.
  -->
  <g transform="translate(240,240)" fill="none" stroke="#0f2547" stroke-opacity="0.14" stroke-width="1.5">
    <!-- escudo, doble contorno -->
    <path d="M -46,-56 Q -46,-74 0,-74 Q 46,-74 46,-56 L 46,-14 Q 46,42 0,72 Q -46,42 -46,-14 Z" />
    <path d="M -36,-48 Q -36,-62 0,-62 Q 36,-62 36,-48 L 36,-14 Q 36,30 0,58 Q -36,30 -36,-14 Z" />

    <!-- estrella de cinco puntas, centrada en el escudo -->
    <path
      d="M0,-34 L6.7,-16.2 L25.9,-16.2 L10.3,-5.1 L16.5,13.4 L0,2.3 L-16.5,13.4 L-10.3,-5.1 L-25.9,-16.2 L-6.7,-16.2 Z"
      fill="#0f2547"
      fill-opacity="0.11"
      stroke="none"
    />

    <!-- laurel derecho -->
    <g>
      <path d="M 48,18 Q 70,40 64,82 Q 61,114 42,136" />
      <ellipse cx="55" cy="34" rx="11" ry="4.5" transform="rotate(38 55 34)" />
      <ellipse cx="63" cy="55" rx="11" ry="4.5" transform="rotate(55 63 55)" />
      <ellipse cx="65" cy="78" rx="11" ry="4.5" transform="rotate(75 65 78)" />
      <ellipse cx="60" cy="101" rx="11" ry="4.5" transform="rotate(95 60 101)" />
      <ellipse cx="50" cy="122" rx="11" ry="4.5" transform="rotate(115 50 122)" />
    </g>
    <!-- laurel izquierdo (espejo) -->
    <g transform="scale(-1,1)">
      <path d="M 48,18 Q 70,40 64,82 Q 61,114 42,136" />
      <ellipse cx="55" cy="34" rx="11" ry="4.5" transform="rotate(38 55 34)" />
      <ellipse cx="63" cy="55" rx="11" ry="4.5" transform="rotate(55 63 55)" />
      <ellipse cx="65" cy="78" rx="11" ry="4.5" transform="rotate(75 65 78)" />
      <ellipse cx="60" cy="101" rx="11" ry="4.5" transform="rotate(95 60 101)" />
      <ellipse cx="50" cy="122" rx="11" ry="4.5" transform="rotate(115 50 122)" />
    </g>
  </g>
</svg>
